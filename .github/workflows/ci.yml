# Lint, guard and test Labyrinth on Linux and Windows.
# Test tools are installed on the disposable CI runners only. On a host,
# Labyrinth installs nothing in the first minute, and afterwards only public
# software from the host's repositories, an event mirror or a pinned download
# (docs/Conventions.md section 1, design 02).
name: CI

# Every push runs CI once, on any branch. A pull request adds no second run
# of the same commit: its branch's push run is the one to read. On a working
# branch, the tests run only when the branch changes something they check
# (the 'changes' job); a branch that only edits documentation skips them.
# A push to main runs them all, except a merge commit whose tree is exactly
# the tree of the branch it merged, when that branch's own run passed: the
# same files were already tested, so the run on main names that run and
# skips the tests.
on:
  push:

# A newer push to a working branch cancels the run it replaces, so runners
# test only the latest commit. Runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    # actions: read lets it look up the merged branch's CI run on main.
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      windows: ${{ steps.diff.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Does this branch change anything the tests check?
        id: diff
        # The whole branch is compared with main, not only the last push, so
        # every commit of a branch that touches code is tested. Only the
        # paths listed here are skipped; anything else, including a new
        # folder, runs the tests. The manual is checked on Linux only (bats
        # and the manual build), so docs/manual alone skips the Windows tests.
        # On main, a merge commit with the same tree as the branch it merged
        # (the branch was up to date with main) skips the tests when that
        # branch head's CI run passed. Anything else on main, including a
        # failed lookup, runs them all.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=false
          windows=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            code=true
            windows=true
            merged="$(git rev-parse -q --verify 'HEAD^2' || true)"
            if [ -z "$merged" ]; then
              echo "Not a merge commit: testing everything."
            elif ! git diff --quiet "$merged" HEAD; then
              echo "The merged tree differs from the branch head $merged: testing everything."
            elif ! run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$merged&status=success&per_page=1" \
                --jq '.workflow_runs[0].id // empty')"; then
              echo "Could not look up the CI run of $merged: testing everything."
            elif [ -z "$run" ]; then
              echo "No passing CI run of $merged: testing everything."
            else
              code=false
              windows=false
              url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
              echo "Same tree as $merged, which passed in run $run: skipping the tests."
              echo "Tests skipped: this merge has the same tree as $merged, which passed in [run $run]($url)." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            base="$(git merge-base origin/main HEAD)"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                docs/manual/*) code=true ;;
                docs/* | *.md | LICENSE | .gitignore | mkdocs.yml | .claude/* | .github/ISSUE_TEMPLATE/* | .github/workflows/docs.yml) ;;
                *) code=true; windows=true ;;
              esac
            done < <(git diff --name-only "$base" HEAD)
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "Tests needed: $code (Windows: $windows)"

  linux:
    name: Linux (bash, ShellCheck, guard, bats)
    needs: changes
    # A skipped job counts as passing for the branch's required checks.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          bats --version
          shellcheck --version

      - name: ShellCheck
        # The guard fixtures are deliberately bad code, so they are skipped.
        run: |
          find . -name '*.sh' -not -path './tests/fixtures/guard/*' -not -path './vendor/*' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning

      - name: Guard (no outside calls, no blanket actions)
        run: bash tests/lint/guard.sh

      - name: bats
        # LAB_REALSYSTEM=1 turns on the real-system tests (real systemd
        # timers, as root): only on these disposable runners.
        env:
          LAB_REALSYSTEM: 1
        run: bats --recursive --print-output-on-failure tests

  manual:
    name: Manuals (Linux and Windows PDFs, man page, help topic)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc --version | head -1
          google-chrome --version

      - name: Build the manuals
        run: bash tools/manual/build.sh build/manual

      - name: Check the man page renders without warnings
        run: |
          # tbl warns about any table near the full width, though its cells wrap.
          warnings="$(groff -t -man -Tutf8 -ww -z build/manual/labyrinth.1 2>&1 | grep -v 'table wider than line length' || true)"
          if [ -n "$warnings" ]; then echo "$warnings"; exit 1; fi
          MANWIDTH=80 man -l build/manual/labyrinth.1 > build/man.txt
          echo "widest rendered line: $(awk '{ if (length > w) w = length } END { print w }' build/man.txt)"
          head -20 build/man.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: labyrinth-manuals
          path: build/manual/
          if-no-files-found: error

  # The Pester files run in four parallel shards, balanced by their CI times.
  # Shards 1 to 3 list their files; shard 4 runs every test file the others
  # do not list, so a new file is always run. Shard 4, the lightest, also runs
  # PSScriptAnalyzer.
  windows-tests:
    name: Windows (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    strategy:
      # Every shard finishes, so one failing shard does not hide another's.
      fail-fast: false
      matrix:
        include:
          - shard: 1
            label: Pester 1 of 4
          - shard: 2
            label: Pester 2 of 4
          - shard: 3
            label: Pester 3 of 4
          - shard: 4
            label: Pester 4 of 4, PSScriptAnalyzer
    env:
      SHARD_1: tests/runner/apply.Tests.ps1 tests/runner/Status.Tests.ps1 tests/runner/HostCheck.Tests.ps1 tests/runner/Hints.Tests.ps1
      SHARD_2: tests/runner/Args.Tests.ps1 tests/runner/Help.Tests.ps1 tests/runner/Failures.Tests.ps1
      SHARD_3: tests/install/Install.Tests.ps1 tests/runner/Output.Tests.ps1 tests/runner/labyrinth.Tests.ps1
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Restore Pester 5 and PSScriptAnalyzer from the cache
        # The key names the exact versions installed below; change both together.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~\Documents\WindowsPowerShell\Modules
          key: windows-ps51-modules-pester-5.7.1-pssa-1.24.0

      - name: Install Pester 5 and PSScriptAnalyzer
        run: |
          $PSVersionTable.PSVersion
          # Exact versions, so a new release cannot change what CI runs.
          if (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'5.7.1' }) {
            'Pester 5.7.1 is already installed (restored from the cache).'
          } else {
            Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          if (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object { $_.Version -eq [version]'1.24.0' }) {
            'PSScriptAnalyzer 1.24.0 is already installed (restored from the cache).'
          } else {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          }

      - name: PSScriptAnalyzer
        if: matrix.shard == 4
        # The guard fixtures are deliberately bad code, so they are skipped.
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $files = Get-ChildItem -Recurse -File -Include *.ps1, *.psm1 |
            Where-Object { $_.FullName -notmatch '\\tests\\fixtures\\guard\\' -and $_.FullName -notmatch '\\vendor\\' }
          $issues = @($files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning, Error })
          if ($issues.Count -gt 0) {
            $issues | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap | Out-String -Width 220
            exit 1
          }
          "PSScriptAnalyzer: $($files.Count) file(s) clean"

      - name: Pester (Windows PowerShell 5.1)
        # LAB_REALSYSTEM=1 turns on the real-system tests (real scheduled
        # tasks, elevated): only on these disposable runners.
        env:
          LAB_REALSYSTEM: 1
          SHARD: ${{ matrix.shard }}
        run: |
          $full = { param($p) [IO.Path]::GetFullPath((Join-Path $PWD $p)).ToLowerInvariant() }
          $lists = @{ 1 = $env:SHARD_1; 2 = $env:SHARD_2; 3 = $env:SHARD_3 }
          $listed = @()
          foreach ($n in 1..3) {
            foreach ($p in ($lists[$n] -split '\s+' | Where-Object { $_ })) {
              # A renamed or deleted file must be taken off its list, not silently skipped.
              if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { "Shard $n lists a missing file: $p"; exit 1 }
              $listed += [pscustomobject]@{ Shard = $n; Path = $p; Full = (& $full $p) }
            }
          }
          $twice = @($listed | Group-Object Full | Where-Object { $_.Count -gt 1 })
          if ($twice.Count -gt 0) { "A file is listed in more than one shard: $($twice[0].Group[0].Path)"; exit 1 }
          if ([int]$env:SHARD -le 3) {
            $paths = @($listed | Where-Object { $_.Shard -eq [int]$env:SHARD } | ForEach-Object { $_.Path })
          } else {
            $taken = @($listed | ForEach-Object { $_.Full })
            $paths = @(Get-ChildItem tests -Recurse -File -Filter *.Tests.ps1 |
              Where-Object { $taken -notcontains $_.FullName.ToLowerInvariant() } | ForEach-Object { $_.FullName })
          }
          "Shard $env:SHARD runs $($paths.Count) file(s):"
          $paths
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = [string[]]$paths
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  # The required check for main. It passes when every Windows shard passed,
  # or when the branch needs no Windows tests (#128), and fails otherwise.
  windows:
    name: Windows (PowerShell 5.1, PSScriptAnalyzer, Pester)
    needs: [changes, windows-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Did every Windows job pass?
        env:
          CHANGES: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.windows }}
          TESTS: ${{ needs.windows-tests.result }}
        run: |
          echo "What changed: $CHANGES. Windows tests needed: $NEEDED. Windows tests: $TESTS."
          [ "$CHANGES" = success ] || exit 1
          if [ "$NEEDED" = true ]; then
            [ "$TESTS" = success ]
          else
            [ "$TESTS" = skipped ]
          fi
