name: Feature
description: A new capability beyond the Roadmap
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        For an idea that is not in `docs/Roadmap.md`. Say who it helps and when they would use it.
        If it is about a published CVE, put the CVE ID in the title and the maintainers will add the `cve` label.
        This repository is public: no event values, real hostnames, addresses or credentials.
  - type: textarea
    id: location
    attributes:
      label: Location & Context
      description: The specs and files it touches.
      placeholder: "Conventions 3.3; labyrinth.sh, labyrinth.ps1"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: What Labyrinth does today, and why that falls short.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Remediation Plan
      description: The steps to build it, and the acceptance tests from the spec, including the negative test that protected accounts and scored services are untouched.
    validations:
      required: true
